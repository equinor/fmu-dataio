name: Test

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: read
  pull-requests: write

jobs:
  run_tests:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install Ert Ubuntu dependencies
        run: |
          sudo apt-get update
          sudo apt-get install libegl1

      - name: Install fmu-dataio
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            uv sync --all-extras --upgrade
          else
            uv sync --all-extras --frozen
          fi

      - name: Install fmu-datamodels
        run: |
          uv pip install \
            "fmu-datamodels @ git+https://github.com/equinor/fmu-datamodels.git"

      # fmu-sumo-uploader blocked by OpenVDS on Python 3.14
      - name: Install fmu-sumo-uploader
        if: matrix.python-version != '3.14'
        run: uv pip install \ "fmu-sumo-uploader @
          git+https://github.com/equinor/fmu-sumo-uploader.git"

      - name: Install ert
        if: matrix.python-version != '3.11'
        run: |
          uv pip install "ert @ git+https://github.com/equinor/ert.git"

      - name: Full test
        run: |
          pytest_args="-n auto -v --cov=src/fmu/dataio --cov-report=xml:fmudataiocoverage.xml --cov-report=term-missing --junitxml=junit.xml -o junit_family=legacy"

          if [ "${{ matrix.python-version }}" = "3.11" ]; then
            pytest_args="$pytest_args --ignore=tests/test_units/test_workflows/test_case_observations.py"
            pytest_args="$pytest_args --deselect=tests/test_ert_integration/test_wf_create_case_metadata.py::test_create_case_metadata_collects_rft_observations_as_expected"
            pytest_args="$pytest_args --deselect=tests/test_ert_integration/test_wf_create_case_metadata.py::test_distribution_models_one_to_one_with_ert"
          fi

          uv run pytest $pytest_args
      
      - name: Upload test coverage to Codecov
        id: codecov-coverage
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: fmudataiocoverage.xml
          disable_search: true
          fail_ci_if_error: true

      - name: Codecov retry sleep
        if: ${{ steps.codecov-coverage.outcome == 'failure' }}
        run: sleep 30

      - name: Upload test coverage to Codecov (retry)
        if: ${{ steps.codecov-coverage.outcome == 'failure' }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: fmudataiocoverage.xml
          disable_search: true
          fail_ci_if_error: ${{ github.ref == 'refs/heads/main' }}

      - name: Publish test summary
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: test-summary/action@37b508cfee6d4d080eedd00b5bb240a6a784a6a5 # v2.6
        with:
          paths: junit.xml

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          files: junit.xml
          disable_search: true

      - name: Test for a clean repository
        if: ${{ !cancelled() }}
        run: |
          # Remove expected test and coverage artifacts.
          ls -la
          rm -rf .coverage
          rm -f fmudataiocoverage.xml junit*.xml
          rm -f codecov.SHA*
          rm -f codecov
          rm -f .coverage.*
          git status --porcelain
          test -z "$(git status --porcelain)"
